version: '3.9'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate
    depends_on:
      - db
    volumes:
      - ./migrations:/migrations
    command: [
      "-path", "/migrations",
      "-database", "postgres://user:password@db:5432/auth_db?sslmode=disable",
      "up"
    ]
    restart: on-failure

  # Production profile
  auth-app:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
      - migrate
    env_file:
      - .env
    ports:
      - "8080:8080"

  # Development profile with hot reload
  auth-app-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
    depends_on:
      - db
      - migrate
      # - redis
    env_file:
      - .env
    ports:
      - "8080:8080"

  # redis:
  #   image: redis:7
  #   restart: always
  #   ports:
  #     - "6379:6379"

volumes:
  postgres-data:
