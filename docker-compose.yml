version: '3.9'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data


  migrate:
    image: migrate/migrate
    depends_on:
      - db
    volumes:
      - ./migrations:/migrations
    # environment:
    #   - DATABASE_URL=${DB_URL}
    env_file:
      - .env
    command: [
      "-path", "/migrations",
      "-database", "${DB_URL}",
      "up"
    ]
    restart: on-failure

  # Production profile
  auth-app:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_started
      migrate:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8080:8080"

  # Development profile with hot reload
  auth-app-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
    depends_on:
      - db
      - migrate
      - redis
    env_file:
      - .env
    ports:
      - "8080:8080"

  redis:
    image: redis:7
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    env_file:
      - .env
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
      - redis-data:/data
    # Do NOT expose Redis port to host machine
    ports: 
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10

volumes:
  postgres-data:
  redis-data: