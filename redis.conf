# Enable authentication
requirepass your_password_here

# # Save snapshots every 15 min if at least 1 key changes
save 900 1

# # Set the working directory for DB persistence
dir /data

# # Limit memory usage (adjust as needed)
maxmemory 256mb
maxmemory-policy allkeys-lru

# # Disable command renaming (optional: disables risky commands)
rename-command FLUSHALL ""
rename-command FLUSHDB ""

# # Bind only to localhost (redundant in Docker, but safe for non-Docker setups)
# bind 127.0.0.1

# # Turn off protected mode (optional inside Docker)
protected-mode no
